      <text x="0" y="55" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1E293B">Vernacular Voice Warnings</text>
      <text x="0" y="75" font-family="system-ui, sans-serif" font-size="11" fill="#64748B">Devanagari Hindi &amp; Gujarati</text>
