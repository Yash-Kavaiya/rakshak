      <stop offset="50%" stop-color="#1B356B"/>
      <stop offset="100%" stop-color="#0A1630"/>
    </linearGradient>
    <linearGradient id="scamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CD2026"/>
      <stop offset="100%" stop-color="#E53935"/>
