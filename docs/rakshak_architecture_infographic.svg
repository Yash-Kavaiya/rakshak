      <text x="0" y="75" font-family="system-ui, sans-serif" font-size="11" fill="#64748B">Genuine bank reminders, delivery</text>
      <text x="0" y="90" font-family="system-ui, sans-serif" font-size="11" fill="#64748B">&amp; family calls remain 100% silent</text>
    </g>

