      <text x="10" y="80" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#CD2026">otp_request</text>
      <text x="10" y="98" font-family="system-ui, sans-serif" font-size="11" fill="#475569">OTP / PIN माँगा</text>

      <rect x="140" y="60" width="130" height="52" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="150" y="80" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#CD2026">remote_app_install</text>
      <text x="150" y="98" font-family="system-ui, sans-serif" font-size="11" fill="#475569">AnyDesk / APK लिंक</text>

      <rect x="280" y="60" width="130" height="52" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="290" y="80" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#CD2026">urgency</text>
      <text x="290" y="98" font-family="system-ui, sans-serif" font-size="11" fill="#475569">जल्दबाज़ी का दबाव</text>

      <rect x="420" y="60" width="130" height="52" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="430" y="80" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#CD2026">personal_data_req</text>
      <text x="430" y="98" font-family="system-ui, sans-serif" font-size="11" fill="#475569">आधार / बैंक डिटेल</text>
