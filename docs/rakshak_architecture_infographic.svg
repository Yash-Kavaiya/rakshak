  <text x="100" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#CBD5E1">Real-Time AI Voice Guardian Against Digital Arrest, Fake KYC &amp; Courier Scams · Full Architecture &amp; Features</text>
  
